; Huckleberry — horse-trailer command center
; Board: QMSD ZX2D80CE02S "SC05_X" — ESP32-S3-WROOM-1 N8R2
;   ST7789 240x320 over 8080 8-bit parallel bus, FT5x06 touch, LEDC backlight.
; Reuses the proven pioarduino platform + esptool pin from the R48Display project.

[env:huckleberry]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip
platform_packages =
  platformio/tool-esptoolpy@1.40801.0
board = esp32-s3-devkitc-1
framework = arduino

; ---- N8R2: 8MB quad flash + 2MB quad PSRAM ----
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
board_build.partitions = partitions.csv

; ---- serial / native USB-CDC ----
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, log2file
upload_speed = 921600

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=0
  -DHUCK_DEBUG=1
  -DLGFX_USE_V1
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude

build_src_filter =
  +<*>
  -<*-Chaffee.cpp>

lib_deps =
  lovyan03/LovyanGFX@^1.2.0
  lvgl/lvgl@8.4.0
  bblanchon/ArduinoJson@^7.4.2
  h2zero/NimBLE-Arduino@^2.5.0

; Flash over Wi-Fi from any dev machine (no USB): pio run -e huckleberry_ota -t upload
[env:huckleberry_ota]
extends = env:huckleberry
upload_protocol = espota
upload_port = huckleberry.local
upload_flags =
  --auth=huckleberry
